[tool.poetry]
name = "adk-vertex-vector-search"
version = "0.1.0"
description = "Agentic RAG in Google's Agent Development Kit, built for Vertex AI Vector Search: an agent that rewrites and decomposes questions, searches with product/version/date restricts, checks whether the context is enough, searches again (max N hops), answers with citations or refuses. One VectorStore interface: a real VertexVectorSearchStore (find_neighbors, streaming upserts, hybrid dense+sparse RRF, restricts, numeric filters, crowding) and a free local look-alike on FAISS + BM25. Runs 100% locally on ollama."
authors = ["Martín Castro Álvarez <martincastro.10.5@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/MartinCastroAlvarez/adk-vertex-vector-search"
repository = "https://github.com/MartinCastroAlvarez/adk-vertex-vector-search"
documentation = "https://github.com/MartinCastroAlvarez/adk-vertex-vector-search#readme"
keywords = [
    "google-adk",
    "agent-development-kit",
    "vertex-ai",
    "vector-search",
    "agentic-rag",
    "rag",
    "hybrid-search",
    "faiss",
    "bm25",
    "ollama",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
packages = [{ include = "agentic_rag" }]
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
agentic-rag = "agentic_rag.cli:main"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
google-adk = ">=2.13,<3"
# The range google-adk[extensions] pins for its LiteLlm wrapper (ollama).
litellm = ">=1.84,<1.106.3"
pydantic = ">=2.12,<3"
numpy = ">=1.26"
faiss-cpu = ">=1.9,<2"
# Local dense embeddings (ONNX, CPU): the default embedder.
fastembed = ">=0.7,<1"
# Snowball stemming for the BM25 sparse vectors (also a fastembed dependency).
py-rust-stemmers = ">=0.1.5,<0.2"
httpx = ">=0.27,<1"
# Security floor for a transitive dependency (CVE-2026-112907/-112913/-112940).
filelock = ">=4.2.1"
# Only for RAG_STORE=vertex / RAG_EMBEDDER=vertex (your project, your bill):
#   pip install "adk-vertex-vector-search[vertex]"
google-cloud-aiplatform = { version = ">=2.6,<3", optional = true }

[tool.poetry.extras]
vertex = ["google-cloud-aiplatform"]

[tool.poetry.group.dev.dependencies]
# ADK's eval tooling (AgentEvaluator, `adk eval`) lives behind the [eval] extra.
google-adk = { version = ">=2.13,<3", extras = ["eval"] }
# The Vertex adapter is tested against fake clients; the SDK is needed for its types only.
google-cloud-aiplatform = ">=2.6,<3"
pytest = "^9.0"
pytest-asyncio = ">=1.0,<2"
pytest-cov = ">=5,<8"
ruff = ">=0.6"
mypy = "^1.11 || ^2.0"
bandit = "^1.7"
pip-audit = "^2.7"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# Ruff - lint + format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "S",            # bandit-style security
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RET",          # returns
    "PIE",          # misc
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S603", "E501"]
"examples/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["agentic_rag", "tests", "examples"]

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=agentic_rag",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # google.api_core (pulled in by the Vertex SDK) warns about Python 3.11's end of life.
    "ignore:You are using a Python version:FutureWarning",
    # ADK's eval service labels its building blocks experimental.
    "ignore:\\[EXPERIMENTAL\\]:UserWarning",
    # ...and its eval runner still passes Runner(plugins=...) internally.
    "ignore:The `plugins` argument is deprecated:DeprecationWarning",
]

# --------------------------------------------------------------------------- #
# MyPy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# None of these ships type hints.
module = ["fastembed", "fastembed.*", "py_rust_stemmers"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["agentic_rag"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
omit = ["agentic_rag/__main__.py"]

# --------------------------------------------------------------------------- #
# Bandit
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["tests", "examples", ".venv", "build", "dist"]
